# ast-grep rules for SonarQube TypeScript/JavaScript rules (schema: ast-grep >= 0.30)
# Multi-document YAML: one rule per document, separated by `---`.
# NOTE: `metadata` is NOT emitted in ast-grep --json output; the merge step
# (scan.sh) re-reads these files to recover sonar_rule/severity/category.
# `constraints` MUST be a top-level sibling of `rule` (not nested per pattern).

# S6676 - console.* usage
id: sonar-S6676-console-log
language: typescript
severity: warning
message: "Uso de console.* - remover antes de produção"
metadata:
  sonar_rule: S6676
  severity: MAJOR
  category: code-smell
rule:
  any:
    - pattern: console.log($$$ARGS)
    - pattern: console.warn($$$ARGS)
    - pattern: console.error($$$ARGS)
    - pattern: console.info($$$ARGS)
    - pattern: console.debug($$$ARGS)
    - pattern: console.trace($$$ARGS)
---
# S4830 - Server certificates should be verified
id: sonar-S4830-reject-unauthorized
language: typescript
severity: error
message: "Verificação de certificado SSL desabilitada (rejectUnauthorized: false)"
metadata:
  sonar_rule: S4830
  severity: BLOCKER
  category: security
rule:
  pattern: "rejectUnauthorized: false"
---
# S2245 - Math.random() is not cryptographically secure
id: sonar-S2245-math-random
language: typescript
severity: error
message: "Math.random() não é criptograficamente seguro"
metadata:
  sonar_rule: S2245
  severity: CRITICAL
  category: security
rule:
  pattern: Math.random()
---
# S1481 - Unused local variables (assigned literal, heuristic)
id: sonar-S1186-empty-function-ts
language: typescript
severity: warning
message: "Corpo de função vazio"
metadata:
  sonar_rule: S1186
  severity: MAJOR
  category: code-smell
rule:
  any:
    - pattern: "function $NAME($$$PARAMS) {}"
    - pattern: "($$$PARAMS) => {}"
---
# S5122 - CORS wildcard origin
id: sonar-S5122-cors-wildcard
language: typescript
severity: error
message: "CORS com origem curinga '*' expõe recursos a qualquer domínio"
metadata:
  sonar_rule: S5122
  severity: CRITICAL
  category: security
rule:
  any:
    - pattern: "origin: '*'"
    - pattern: "origin: \"*\""
---
# S2703 / debugger statement should not be used
id: sonar-S1442-debugger
language: typescript
severity: warning
message: "Instrução debugger não deve permanecer no código"
metadata:
  sonar_rule: S1442
  severity: MAJOR
  category: code-smell
rule:
  pattern: debugger
